services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DEFAULT_AUTH_KEY: ${NEXT_PUBLIC_DEFAULT_AUTH_KEY:-}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: images-generate:latest
    container_name: images-generate
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      STORAGE_BACKEND: ${STORAGE_BACKEND:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      CHATGPT2API_AUTH_KEY: ${CHATGPT2API_AUTH_KEY:-}
      CHATGPT2API_BASE_URL: ${CHATGPT2API_BASE_URL:-}
      IMAGE_PROXY_BASE_URL: ${IMAGE_PROXY_BASE_URL:-http://165.154.254.130:3000}
      IMAGE_PROXY_IP_QUOTA_LIMIT: ${IMAGE_PROXY_IP_QUOTA_LIMIT:-20}
